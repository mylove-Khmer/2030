<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FB Accounts Store - KHQR</title>
  
  <!-- QRCode.js library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navbar */
    .navbar {
      background-color: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      font-size: 18px;
      font-weight: bold;
      color: #38bdf8;
    }

    .user-panel {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .balance-badge {
      background-color: #0f172a;
      border: 1px solid #3b82f6;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      color: #93c5fd;
    }

    .balance-badge span {
      color: #22c55e;
      font-weight: bold;
    }

    .btn-topup {
      background-color: #e1192e;
      color: #ffffff;
      border: none;
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-topup:hover {
      background-color: #be1224;
    }

    /* Container & Products */
    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
      width: 100%;
      flex: 1;
    }

    .header-section { margin-bottom: 24px; }
    .header-section h1 { font-size: 24px; margin-bottom: 6px; }
    .header-section p { color: #94a3b8; font-size: 14px; }

    .filter-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .filter-btn.active {
      background-color: #2563eb;
      border-color: #2563eb;
      color: #ffffff;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .product-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .product-title { font-size: 16px; font-weight: 600; color: #ffffff; }

    .country-tag {
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: bold;
    }

    .tag-kh { background-color: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid #ef4444; }
    .tag-us { background-color: rgba(59, 130, 246, 0.2); color: #93c5fd; border: 1px solid #3b82f6; }

    .product-meta {
      list-style: none;
      margin-bottom: 18px;
      font-size: 13px;
      color: #94a3b8;
    }

    .product-meta li {
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed #334155;
      padding-bottom: 4px;
    }

    .product-meta li span.highlight { color: #f1f5f9; font-weight: 500; }
    .stock-badge { color: #22c55e !important; font-weight: bold; }

    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .price-tag { font-size: 20px; font-weight: bold; color: #38bdf8; }

    .btn-buy {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Modal General Overlay */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .modal-box {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
      width: 90%;
      max-width: 400px;
      text-align: center;
    }

    /* KHQR Standee Card Theme */
    .khqr-standee-card {
      background: #ffffff;
      border-radius: 24px;
      width: 95%;
      max-width: 370px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      position: relative;
      text-align: center;
      padding-bottom: 22px;
      animation: popUp 0.25s ease-out;
    }

    @keyframes popUp {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* ក្បាលក្រហម KHQR ខាងលើ */
    .khqr-top-banner {
      background-color: #e1192e;
      height: 65px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .khqr-top-banner h2 {
      color: #ffffff;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 3px;
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
    }

    .khqr-close-btn {
      position: absolute;
      top: 10px;
      right: 14px;
      background: transparent;
      border: none;
      font-size: 28px;
      color: #ffffff;
      cursor: pointer;
      opacity: 0.85;
      line-height: 1;
    }
    .khqr-close-btn:hover { opacity: 1; }

    .khqr-body {
      padding: 16px 20px 0 20px;
    }

    /* ប្រអប់បញ្ចូលតម្លៃលុយ */
    .amount-control {
      margin-bottom: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    .amount-control label {
      color: #475569;
      font-size: 14px;
      font-weight: 600;
    }

    .amount-control input {
      width: 105px;
      padding: 5px 8px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      color: #0f172a;
      outline: none;
      text-align: center;
    }
    .amount-control input:focus {
      border-color: #e1192e;
    }

    .dash-separator {
      border: none;
      border-top: 2px dashed #e2e8f0;
      margin: 12px 0 16px;
    }

    /* ប្រអប់ QR Code ធំទូលាយ */
    .qr-large-wrapper {
      position: relative;
      display: inline-block;
      margin: 0 auto;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #qrcode canvas, #qrcode img {
      display: block;
    }

    /* Logo ផ្កាចន្ទន៍ Bakong ក្រហម ចំកណ្តាល QR */
    .bakong-center-logo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 44px;
      height: 44px;
      background: #e1192e;
      border: 3.5px solid #ffffff;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      pointer-events: none;
    }

    .bakong-center-logo svg {
      width: 22px;
      height: 22px;
      fill: #ffffff;
    }

    .memo-text {
      font-size: 13px;
      color: #64748b;
      margin: 14px 0 16px;
    }
    .memo-text strong {
      color: #0f172a;
      letter-spacing: 0.5px;
    }

    .btn-done-red {
      width: calc(100% - 40px);
      margin: 0 20px;
      padding: 12px;
      background-color: #e1192e;
      border: none;
      border-radius: 12px;
      color: #ffffff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-done-red:hover {
      background-color: #be1224;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="brand">🌐 FB Accounts Store</div>
    <div class="user-panel">
      <div class="balance-badge">សមតុល្យ: <span id="userBalance">$0.00</span></div>
      <button class="btn-topup" onclick="openDepositModal()">+ បញ្ចូលលុយ</button>
    </div>
  </nav>

  <!-- Container -->
  <div class="container">
    <div class="header-section">
      <h1>បញ្ជីគណនី Facebook សម្រាប់លក់</h1>
      <p>ជ្រើសរើសប្រភេទគណនីតាមប្រទេស អាយុកាល និងតម្លៃដែលអ្នកត្រូវការ</p>
    </div>

    <div class="filter-bar">
      <button class="filter-btn active" onclick="filterProducts('all', this)">ទាំងអស់</button>
      <button class="filter-btn" onclick="filterProducts('KH', this)">🇰🇭 Account ខ្មែរ</button>
      <button class="filter-btn" onclick="filterProducts('US', this)">🇺🇸 Account អាមេរិក</button>
    </div>

    <div class="product-grid" id="productContainer"></div>
  </div>

  <!-- Buy Modal -->
  <div class="modal-overlay" id="buyModal">
    <div class="modal-box">
      <h3 id="modalTitle">បញ្ជាក់ការទិញ</h3>
      <p id="modalDesc">តើអ្នកពិតជាចង់ទិញគណនីនេះមែនទេ?</p>
      <div style="display:flex; gap:10px; justify-content:center;">
        <button style="background:#475569; color:white; border:none; padding:8px 16px; border-radius:6px; cursor:pointer;" onclick="closeBuyModal()">បោះបង់</button>
        <button style="background:#22c55e; color:white; border:none; padding:8px 16px; border-radius:6px; cursor:pointer; font-weight:bold;" onclick="confirmPurchase()">យល់ព្រមទិញ</button>
      </div>
    </div>
  </div>

  <!-- KHQR Standee Modal -->
  <div class="modal-overlay" id="depositModal">
    <div class="khqr-standee-card">
      
      <!-- ក្បាលក្រហម KHQR -->
      <div class="khqr-top-banner">
        <h2>KHQR</h2>
        <button class="khqr-close-btn" onclick="closeDepositModal()">&times;</button>
      </div>

      <div class="khqr-body">
        <!-- ប្រអប់វាយចំនួនលុយ -->
        <div class="amount-control">
          <label>ចំនួនទឹកប្រាក់ ($):</label>
          <input type="number" step="any" min="0.1" id="customAmountInput" value="2.00" oninput="onAmountChanged()">
        </div>

        <hr class="dash-separator">

        <!-- រូប QR Code ធំច្បាស់ និង Logo Bakong កណ្តាល -->
        <div class="qr-large-wrapper">
          <div id="qrcode"></div>
          <div class="bakong-center-logo">
            <svg viewBox="0 0 24 24">
              <path d="M12 2L9.19 8.63L2 9.24L7.46 13.97L5.82 21L12 17.27L18.18 21L16.54 13.97L22 9.24L14.81 8.63L12 2Z"/>
            </svg>
          </div>
        </div>

        <!-- Memo -->
        <div class="memo-text">
          កូដសម្គាល់ (Memo): <strong id="transferCode">TOPUP9562</strong>
        </div>
      </div>

      <!-- ប៊ូតុងបញ្ជាក់ការផ្ទេរ -->
      <button class="btn-done-red" onclick="submitDepositNotification()">ខ្ញុំបានផ្ទេររួចរាល់</button>

    </div>
  </div>

  <script>
    // ១. ក្បួនគណនា CRC16-CCITT សម្រាប់ Bakong KHQR
    function getCRC16(data) {
      let crc = 0xFFFF;
      for (let i = 0; i < data.length; i++) {
        crc ^= data.charCodeAt(i) << 8;
        for (let j = 0; j < 8; j++) {
          if ((crc & 0x8000) !== 0) {
            crc = ((crc << 1) ^ 0x1021) & 0xFFFF;
          } else {
            crc = (crc << 1) & 0xFFFF;
          }
        }
      }
      let hex = crc.toString(16).toUpperCase();
      return hex.padStart(4, '0');
    }

    // ២. បង្កើត KHQR String ស្វ័យប្រវត្តិដែលមានតម្លៃទឹកប្រាក់ស្រាប់
    function generateDynamicKHQR(amount) {
      const formattedAmount = Number(amount).toFixed(2);
      const amtTag = "54" + formattedAmount.length.toString().padStart(2, '0') + formattedAmount;

      const basePayload = 
        "000201010212" +
        "30510016abaakhppxxx@abaa01151260903142910660208ABA Bank" +
        "52046513" +
        "5303840" +
        amtTag + 
        "5802KH" +
        "5911MON SAMNANG" +
        "6012KAMPONG THOM" +
        "624268380010PAYWAY@ABA0107195096202090324860766304";

      const finalChecksum = getCRC16(basePayload);
      return basePayload + finalChecksum;
    }

    // ៣. បង្ហាញ QR Code ចូលទៅក្នុងប្រអប់ (ទំហំធំ 250px)
    let qrMaker = null;
    function renderQR(amount) {
      const qrContainer = document.getElementById("qrcode");
      qrContainer.innerHTML = "";

      const khqrString = generateDynamicKHQR(amount);

      qrMaker = new QRCode(qrContainer, {
        text: khqrString,
        width: 250,
        height: 250,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });
    }

    function onAmountChanged() {
      const val = parseFloat(document.getElementById("customAmountInput").value);
      if (!isNaN(val) && val > 0) {
        renderQR(val);
      }
    }

    function openDepositModal() {
      const randomMemo = "TOPUP" + Math.floor(1000 + Math.random() * 9000);
      document.getElementById('transferCode').textContent = randomMemo;
      document.getElementById('depositModal').style.display = 'flex';
      
      const currentVal = parseFloat(document.getElementById("customAmountInput").value) || 2.00;
      renderQR(currentVal);
    }

    function closeDepositModal() {
      document.getElementById('depositModal').style.display = 'none';
    }

    // ៤. ដំណើរការពេលភ្ញៀវចុច "ខ្ញុំបានផ្ទេររួចរាល់"
    function submitDepositNotification() {
      const amount = document.getElementById("customAmountInput").value;
      const memo = document.getElementById("transferCode").textContent;

      alert(`សំណើបញ្ចូលប្រាក់ចំនួន $${amount} (Memo: ${memo}) ត្រូវបានកត់ត្រា!\n\nសូមរក្សាទុកវិក្កយបត្រ ABA របស់អ្នក ឬផ្ញើវិក្កយបត្រទៅកាន់ Admin ដើម្បីពិនិត្យ និងបញ្ចូលសមតុល្យជូន។`);
      
      closeDepositModal();
    }

    // ៥. ទិន្នន័យទំនិញ
    const products = [
      { id: 1, title: "Via FB ខ្មែរ (Old Account)", country: "KH", countryName: "ខ្មែរ 🇰🇭", age: "បង្កើតឆ្នាំ 2018 - 2020", format: "UID | Pass | 2FA | Mail", stock: 24, price: 1.50 },
      { id: 2, title: "Clone FB ខ្មែរ (បង្កើតថ្មី)", country: "KH", countryName: "ខ្មែរ 🇰🇭", age: "អាយុ 1 - 3 ខែ", format: "UID | Pass | 2FA", stock: 50, price: 0.35 },
      { id: 3, title: "Via FB អាមេរិក (US Aged)", country: "US", countryName: "អាមេរិក 🇺🇸", age: "បង្កើតឆ្នាំ 2015 - 2017", format: "UID | Pass | 2FA | Hotmail", stock: 12, price: 3.20 },
      { id: 4, title: "Via FB អាមេរិក (Run Ads)", country: "US", countryName: "អាមេរិក 🇺🇸", age: "បង្កើតឆ្នាំ 2021 - 2022", format: "UID | Pass | 2FA | Mail", stock: 18, price: 2.00 }
    ];

    let currentBalance = 0.00;
    let selectedProduct = null;

    function renderProducts(items) {
      const container = document.getElementById('productContainer');
      container.innerHTML = "";
      items.forEach(item => {
        const tagClass = item.country === 'KH' ? 'tag-kh' : 'tag-us';
        container.innerHTML += `
          <div class="product-card">
            <div>
              <div class="card-top">
                <div class="product-title">${item.title}</div>
                <span class="country-tag ${tagClass}">${item.countryName}</span>
              </div>
              <ul class="product-meta">
                <li><span>អាយុអាខោន:</span><span class="highlight">${item.age}</span></li>
                <li><span>ទម្រង់ទិន្នន័យ:</span><span>${item.format}</span></li>
                <li><span>ស្តុកនៅសល់:</span><span class="stock-badge">${item.stock} អាខោន</span></li>
              </ul>
            </div>
            <div class="card-bottom">
              <div class="price-tag">$${item.price.toFixed(2)}</div>
              <button class="btn-buy" onclick="openBuyModal(${item.id})">ទិញភ្លាមៗ</button>
            </div>
          </div>
        `;
      });
    }

    function filterProducts(type, btnElement) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');
      if (type === 'all') renderProducts(products);
      else renderProducts(products.filter(p => p.country === type));
    }

    function openBuyModal(productId) {
      selectedProduct = products.find(p => p.id === productId);
      document.getElementById('modalTitle').textContent = `ទិញ: ${selectedProduct.title}`;
      document.getElementById('modalDesc').innerHTML = `តម្លៃ: <strong>$${selectedProduct.price.toFixed(2)}</strong><br>តើអ្នកយល់ព្រមទិញដែរឬទេ?`;
      document.getElementById('buyModal').style.display = 'flex';
    }

    function closeBuyModal() {
      document.getElementById('buyModal').style.display = 'none';
      selectedProduct = null;
    }

    function confirmPurchase() {
      if (!selectedProduct) return;
      if (currentBalance < selectedProduct.price) {
        alert("សមតុល្យមិនគ្រប់គ្រាន់ទេ! សូមចុច '+ បញ្ចូលលុយ' តាម KHQR។");
        closeBuyModal();
        return;
      }
      currentBalance -= selectedProduct.price;
      document.getElementById('userBalance').textContent = `$${currentBalance.toFixed(2)}`;
      selectedProduct.stock -= 1;
      renderProducts(products);
      alert(`ការទិញជោគជ័យ!\nទិន្នន័យ: 1000849281928|Pass123456|JBSWY3DPEHPK3PXP|mail@domain.com`);
      closeBuyModal();
    }

    // ចាប់ផ្ដើម
    renderProducts(products);
  </script>
</body>
</html>
