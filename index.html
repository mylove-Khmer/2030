<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ផ្ទាំងទិញគណនី Facebook - Shop Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navbar */
    .navbar {
      background-color: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      font-size: 18px;
      font-weight: bold;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user-panel {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .balance-badge {
      background-color: #0f172a;
      border: 1px solid #3b82f6;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      color: #93c5fd;
    }

    .balance-badge span {
      color: #22c55e;
      font-weight: bold;
    }

    /* Container */
    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
      width: 100%;
      flex: 1;
    }

    .header-section {
      margin-bottom: 24px;
    }

    .header-section h1 {
      font-size: 24px;
      margin-bottom: 6px;
    }

    .header-section p {
      color: #94a3b8;
      font-size: 14px;
    }

    /* Filter Buttons */
    .filter-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }

    .filter-btn:hover, .filter-btn.active {
      background-color: #2563eb;
      border-color: #2563eb;
      color: #ffffff;
    }

    /* Product Grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .product-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }

    .product-card:hover {
      transform: translateY(-3px);
      border-color: #3b82f6;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .product-title {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      line-height: 1.4;
    }

    .country-tag {
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .tag-kh {
      background-color: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border: 1px solid #ef4444;
    }

    .tag-us {
      background-color: rgba(59, 130, 246, 0.2);
      color: #93c5fd;
      border: 1px solid #3b82f6;
    }

    .product-meta {
      list-style: none;
      margin-bottom: 18px;
      font-size: 13px;
      color: #94a3b8;
    }

    .product-meta li {
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed #334155;
      padding-bottom: 4px;
    }

    .product-meta li span.highlight {
      color: #f1f5f9;
      font-weight: 500;
    }

    .stock-badge {
      color: #22c55e !important;
      font-weight: bold;
    }

    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .price-tag {
      font-size: 20px;
      font-weight: bold;
      color: #38bdf8;
    }

    .btn-buy {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-buy:hover {
      background-color: #1d4ed8;
    }

    /* Simple Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .modal-box {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
      width: 90%;
      max-width: 400px;
      text-align: center;
    }

    .modal-box h3 {
      margin-bottom: 10px;
    }

    .modal-box p {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .btn-cancel {
      background-color: #475569;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-confirm {
      background-color: #22c55e;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="brand">
      🌐 FB Accounts Store
    </div>
    <div class="user-panel">
      <div class="balance-badge">
        សមតុល្យ: <span id="userBalance">$10.00</span>
      </div>
      <span style="font-size: 14px; color: #cbd5e1;">សួស្តី, <strong>ភ្ញៀវ</strong></span>
    </div>
  </nav>

  <!-- Content -->
  <div class="container">
    <div class="header-section">
      <h1>បញ្ជីគណនី Facebook សម្រាប់លក់</h1>
      <p>ជ្រើសរើសប្រភេទគណនីតាមប្រទេស អាយុកាល និងតម្លៃដែលអ្នកត្រូវការ</p>
    </div>

    <!-- Filter Tab -->
    <div class="filter-bar">
      <button class="filter-btn active" onclick="filterProducts('all', this)">ទាំងអស់</button>
      <button class="filter-btn" onclick="filterProducts('KH', this)">🇰🇭 Account ខ្មែរ</button>
      <button class="filter-btn" onclick="filterProducts('US', this)">🇺🇸 Account អាមេរិក</button>
    </div>

    <!-- Accounts Grid -->
    <div class="product-grid" id="productContainer">
      <!-- កាតទំនិញនឹងបង្ហាញនៅត្រង់នេះដោយស្វ័យប្រវត្តិតាមរយៈ JS -->
    </div>
  </div>

  <!-- Modal Confirmation Popup -->
  <div class="modal-overlay" id="buyModal">
    <div class="modal-box">
      <h3 id="modalTitle">បញ្ជាក់ការទិញ</h3>
      <p id="modalDesc">តើអ្នកពិតជាចង់ទិញគណនីនេះមែនទេ?</p>
      <div class="modal-buttons">
        <button class="btn-cancel" onclick="closeModal()">បោះបង់</button>
        <button class="btn-confirm" onclick="confirmPurchase()">យល់ព្រមទិញ</button>
      </div>
    </div>
  </div>

  <script>
    // ១. បញ្ជីទិន្នន័យគណនីសាកល្បង (Mock Data)
    const products = [
      {
        id: 1,
        title: "Via FB ខ្មែរ (Old Account)",
        country: "KH",
        countryName: "ខ្មែរ 🇰🇭",
        age: "បង្កើតឆ្នាំ 2018 - 2020 (អាយុ 4-6 ឆ្នាំ)",
        format: "UID | Pass | 2FA | Mail",
        stock: 24,
        price: 1.50
      },
      {
        id: 2,
        title: "Clone FB ខ្មែរ (បង្កើតថ្មី)",
        country: "KH",
        countryName: "ខ្មែរ 🇰🇭",
        age: "អាយុ 1 - 3 ខែ (New Profile)",
        format: "UID | Pass | 2FA",
        stock: 50,
        price: 0.35
      },
      {
        id: 3,
        title: "Via FB អាមេរិក (US Aged)",
        country: "US",
        countryName: "អាមេរិក 🇺🇸",
        age: "បង្កើតឆ្នាំ 2015 - 2017 (អាយុ 7-9 ឆ្នាំ)",
        format: "UID | Pass | 2FA | Hotmail | Cookie",
        stock: 12,
        price: 3.20
      },
      {
        id: 4,
        title: "Via FB អាមេរិក (Run Ads)",
        country: "US",
        countryName: "អាមេរិក 🇺🇸",
        age: "បង្កើតឆ្នាំ 2021 - 2022 (អាយុ 2-3 ឆ្នាំ)",
        format: "UID | Pass | 2FA | Mail",
        stock: 18,
        price: 2.00
      }
    ];

    let currentBalance = 10.00;
    let selectedProduct = null;

    // ២. បង្ហាញបញ្ជីទំនិញចូល HTML
    function renderProducts(items) {
      const container = document.getElementById('productContainer');
      container.innerHTML = "";

      if (items.length === 0) {
        container.innerHTML = "<p style='color: #64748b;'>មិនមានទំនិញក្នុងប្រភេទនេះទេ</p>";
        return;
      }

      items.forEach(item => {
        const tagClass = item.country === 'KH' ? 'tag-kh' : 'tag-us';
        const card = `
          <div class="product-card">
            <div>
              <div class="card-top">
                <div class="product-title">${item.title}</div>
                <span class="country-tag ${tagClass}">${item.countryName}</span>
              </div>
              <ul class="product-meta">
                <li>
                  <span>អាយុអាខោន:</span>
                  <span class="highlight">${item.age}</span>
                </li>
                <li>
                  <span>ទម្រង់ទិន្នន័យ:</span>
                  <span>${item.format}</span>
                </li>
                <li>
                  <span>ស្តុកនៅសល់:</span>
                  <span class="stock-badge">${item.stock} អាខោន</span>
                </li>
              </ul>
            </div>
            <div class="card-bottom">
              <div class="price-tag">$${item.price.toFixed(2)}</div>
              <button class="btn-buy" onclick="openBuyModal(${item.id})">ទិញភ្លាមៗ</button>
            </div>
          </div>
        `;
        container.innerHTML += card;
      });
    }

    // ៣. មុខងារ Filter តាមប្រទេស
    function filterProducts(type, btnElement) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');

      if (type === 'all') {
        renderProducts(products);
      } else {
        const filtered = products.filter(p => p.country === type);
        renderProducts(filtered);
      }
    }

    // ៤. មុខងារទិញទំនិញ (Modal Logic)
    function openBuyModal(productId) {
      selectedProduct = products.find(p => p.id === productId);
      document.getElementById('modalTitle').textContent = `ទិញ: ${selectedProduct.title}`;
      document.getElementById('modalDesc').innerHTML = `តម្លៃ: <strong>$${selectedProduct.price.toFixed(2)}</strong> | អាយុ: ${selectedProduct.age}<br>តើអ្នកយល់ព្រមទិញដែរឬទេ?`;
      document.getElementById('buyModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('buyModal').style.display = 'none';
      selectedProduct = null;
    }

    function confirmPurchase() {
      if (!selectedProduct) return;

      if (currentBalance < selectedProduct.price) {
        alert("សមតុល្យលុយរបស់អ្នកមិនគ្រប់គ្រាន់ទេ! សូមបញ្ចូលលុយបន្ថែម។");
        closeModal();
        return;
      }

      // កាត់លុយ
      currentBalance -= selectedProduct.price;
      document.getElementById('userBalance').textContent = `$${currentBalance.toFixed(2)}`;
      
      // កាត់ស្តុក
      selectedProduct.stock -= 1;
      renderProducts(products);

      alert(`ការទិញបានជោគជ័យ!\n\nព័ត៌មានគណនីរបស់អ្នក:\n1000849281928|Pass123456|JBSWY3DPEHPK3PXP|mail@domain.com`);
      closeModal();
    }

    // ចាប់ផ្ដើមដំណើរការបង្ហាញទំនិញទាំងអស់ពេលបើកទំព័រដំបូង
    renderProducts(products);
  </script>
</body>
</html>
