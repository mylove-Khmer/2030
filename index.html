<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Store - ABA Pay</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap');
    * { font-family: 'Kantumruy Pro', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 flex items-center justify-center">

  <!-- ១. ផ្ទាំងចុះឈ្មោះ (Register) -->
  <div id="register-card" class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200 max-w-sm w-full space-y-4">
    <h2 class="text-xl font-bold text-slate-800 text-center">ចុះឈ្មោះចូលប្រើប្រាស់</h2>
    <div>
      <label class="text-xs font-semibold text-slate-600">ឈ្មោះអ្នកប្រើ (Username)</label>
      <input type="text" id="reg-name" placeholder="ឈ្មោះរបស់អ្នក" class="w-full mt-1 p-2.5 border rounded-lg text-sm outline-none focus:border-sky-800">
    </div>
    <div>
      <label class="text-xs font-semibold text-slate-600">អ៊ីមែល (Email)</label>
      <input type="email" id="reg-email" placeholder="example@email.com" class="w-full mt-1 p-2.5 border rounded-lg text-sm outline-none focus:border-sky-800">
    </div>
    <div>
      <label class="text-xs font-semibold text-slate-600">ពាក្យសម្ងាត់ (Password)</label>
      <input type="password" id="reg-password" placeholder="••••••••" class="w-full mt-1 p-2.5 border rounded-lg text-sm outline-none focus:border-sky-800">
    </div>
    <button onclick="handleRegister()" class="w-full py-2.5 bg-sky-800 hover:bg-sky-900 text-white font-bold rounded-lg text-sm shadow transition">ចុះឈ្មោះ</button>
  </div>

  <!-- ២. ផ្ទាំងបញ្ជីទំនិញ/សេវាកម្ម (Store) -->
  <div id="store-card" class="hidden max-w-3xl w-full bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200 space-y-6">
    <div class="flex justify-between items-center border-b pb-4">
      <div>
        <h2 class="text-lg font-bold text-slate-800" id="welcome-text">ស្វាគមន៍!</h2>
        <span class="text-xs text-slate-500" id="user-email-badge"></span>
      </div>
      <button onclick="handleLogout()" class="text-xs text-rose-600 font-semibold hover:underline">ចាកចេញ</button>
    </div>

    <!-- បញ្ជីទំនិញបង្ហាញត្រង់នេះ -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-h-[65vh] overflow-y-auto pr-1" id="products-container"></div>
  </div>

  <!-- ៣. ផ្ទាំង Modal ABA PAY KHQR -->
  <div id="payment-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-xs w-full overflow-hidden shadow-2xl border border-slate-200 text-center">
      <div class="bg-sky-800 text-white py-3">
        <h3 class="font-bold tracking-wider">ABA PAY KHQR</h3>
      </div>
      
      <div class="p-5 space-y-3">
        <div class="text-xs text-slate-500 font-semibold" id="qr-product-name">ឈ្មោះទំនិញ</div>
        <div class="text-2xl font-bold text-slate-800" id="qr-amount">$0.00</div>
        
        <div class="flex justify-center my-2">
          <canvas id="modal-qr" class="border rounded-xl p-2 bg-white"></canvas>
        </div>

        <p class="text-xs text-emerald-600 font-semibold">✓ កំណត់ចំនួនទឹកប្រាក់ស្វ័យប្រវត្តិ</p>
        <button onclick="closeModal()" class="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-lg">បិទផ្ទាំង</button>
      </div>
    </div>
  </div>

  <script>
    // បញ្ជីទំនិញបែងចែកតាមប្រទេស ឆ្នាំ និងតម្លៃ
    const productList = [
      { name: "កញ្ចប់ KH", country: "Cambodia", year: "2025", price: 0.50 },
      { name: "កញ្ចប់ KH", country: "Cambodia", year: "2023", price: 1.00 },
      { name: "កញ្ចប់ KH", country: "Cambodia", year: "2020", price: 3.50 },
      { name: "កញ្ចប់ KH", country: "Cambodia", year: "2018", price: 5.00 },
      { name: "កញ្ចប់ KH", country: "Cambodia", year: "2015", price: 7.00 },
      { name: "កញ្ចប់ KH", country: "Cambodia", year: "2010", price: 9.00 },
      { name: "កញ្ចប់ USA", country: "USA", year: "2025", price: 1.00 },
      { name: "កញ្ចប់ USA", country: "USA", year: "2023", price: 2.00 },
      { name: "កញ្ចប់ USA", country: "USA", year: "2020", price: 4.00 },
      { name: "កញ្ចប់ USA", country: "USA", year: "2018", price: 6.00 },
      { name: "កញ្ចប់ USA", country: "USA", year: "2015", price: 8.00 },
      { name: "កញ្ចប់ USA", country: "USA", year: "2010", price: 15.00 }
    ];

    // បង្ហាញបញ្ជីទំនិញ
    function renderProducts() {
      const container = document.getElementById('products-container');
      container.innerHTML = '';

      productList.forEach(item => {
        const badgeColor = item.country === 'USA' ? 'bg-indigo-100 text-indigo-700' : 'bg-emerald-100 text-emerald-700';
        const itemFullName = `${item.name} + ឆ្នាំ${item.year}`;

        container.innerHTML += `
          <div class="border rounded-xl p-4 flex flex-col justify-between hover:border-sky-700 transition space-y-3 bg-white">
            <div>
              <div class="flex items-center gap-2">
                <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded ${badgeColor}">${item.country}</span>
                <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-600">ឆ្នាំ ${item.year}</span>
              </div>
              <h3 class="font-bold text-slate-800 text-sm mt-2">${itemFullName}</h3>
              <div class="text-xl font-bold text-sky-800 mt-1">$${item.price.toFixed(2)}</div>
            </div>
            <button onclick="openPayment('${itemFullName}', ${item.price})" class="w-full py-2 bg-sky-800 hover:bg-sky-900 text-white text-xs font-bold rounded-lg shadow-sm">
              ទិញឥឡូវនេះ
            </button>
          </div>
        `;
      });
    }

    // គណនា CRC16-CCITT សម្រាប់ ABA KHQR
    function getCRC16(str) {
      let crc = 0xFFFF;
      for (let i = 0; i < str.length; i++) {
        crc ^= str.charCodeAt(i) << 8;
        for (let j = 0; j < 8; j++) {
          if ((crc & 0x8000) !== 0) {
            crc = (crc << 1) ^ 0x1021;
          } else {
            crc = crc << 1;
          }
        }
      }
      return (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
    }

    // បង្កើត Dynamic ABA KHQR
    function generateABA_KHQR(amount) {
      const formattedAmount = Number(amount).toFixed(2);
      const amountStr = String(formattedAmount);
      const amountTag = `54${String(amountStr.length).padStart(2, '0')}${amountStr}`;
      const rawPayload = `00020101021230510016abaakhppxxx@abaa01151260903142910660208ABA Bank520465135303840${amountTag}5802KH5911MON SAMNANG6012KAMPONG THOM624268380010PAYWAY@ABA0107195096202090324860766304`;
      return rawPayload + getCRC16(rawPayload);
    }

    function handleRegister() {
      const username = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;

      if (!username || !email || !password) {
        alert('សូមបំពេញព័ត៌មានឱ្យបានគ្រប់គ្រាន់!');
        return;
      }

      localStorage.setItem('user_session', JSON.stringify({ username, email }));
      showStoreView(username, email);
    }

    function showStoreView(username, email) {
      document.getElementById('register-card').classList.add('hidden');
      document.getElementById('store-card').classList.remove('hidden');
      document.getElementById('welcome-text').textContent = `សួស្តី, ${username}!`;
      document.getElementById('user-email-badge').textContent = email;
      renderProducts();
    }

    function handleLogout() {
      localStorage.removeItem('user_session');
      document.getElementById('store-card').classList.add('hidden');
      document.getElementById('register-card').classList.remove('hidden');
      document.getElementById('reg-password').value = '';
    }

    function openPayment(productName, price) {
      document.getElementById('qr-product-name').textContent = productName;
      document.getElementById('qr-amount').textContent = `$${price.toFixed(2)}`;
      document.getElementById('payment-modal').classList.remove('hidden');

      const dynamicQR = generateABA_KHQR(price);
      QRCode.toCanvas(document.getElementById('modal-qr'), dynamicQR, {
        width: 170,
        margin: 1,
        errorCorrectionLevel: 'M'
      });
    }

    function closeModal() {
      document.getElementById('payment-modal').classList.add('hidden');
    }

    window.onload = function() {
      const session = localStorage.getItem('user_session');
      if (session) {
        const user = JSON.parse(session);
        showStoreView(user.username, user.email);
      }
    };
  </script>

</body>
</html>
