<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FB Accounts Store - KHQR</title>
  
  <!-- QRCode.js library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navbar */
    .navbar {
      background-color: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      font-size: 18px;
      font-weight: bold;
      color: #38bdf8;
    }

    .user-panel {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .balance-badge {
      background-color: #0f172a;
      border: 1px solid #3b82f6;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      color: #93c5fd;
    }

    .balance-badge span {
      color: #22c55e;
      font-weight: bold;
    }

    .btn-topup {
      background-color: #22c55e;
      color: #ffffff;
      border: none;
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-topup:hover {
      background-color: #16a34a;
    }

    /* Container & Products */
    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
      width: 100%;
      flex: 1;
    }

    .header-section { margin-bottom: 24px; }
    .header-section h1 { font-size: 24px; margin-bottom: 6px; }
    .header-section p { color: #94a3b8; font-size: 14px; }

    .filter-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .filter-btn.active {
      background-color: #2563eb;
      border-color: #2563eb;
      color: #ffffff;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .product-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .product-title { font-size: 16px; font-weight: 600; color: #ffffff; }

    .country-tag {
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: bold;
    }

    .tag-kh { background-color: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid #ef4444; }
    .tag-us { background-color: rgba(59, 130, 246, 0.2); color: #93c5fd; border: 1px solid #3b82f6; }

    .product-meta {
      list-style: none;
      margin-bottom: 18px;
      font-size: 13px;
      color: #94a3b8;
    }

    .product-meta li {
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed #334155;
      padding-bottom: 4px;
    }

    .product-meta li span.highlight { color: #f1f5f9; font-weight: 500; }
    .stock-badge { color: #22c55e !important; font-weight: bold; }

    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .price-tag { font-size: 20px; font-weight: bold; color: #38bdf8; }

    .btn-buy {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Modal General */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .modal-box {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
      width: 90%;
      max-width: 400px;
      text-align: center;
    }

    /* ABA KHQR Card Style */
    .aba-card {
      background: #004b6e;
      border-radius: 24px;
      width: 92%;
      max-width: 360px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .close-card-btn {
      position: absolute;
      top: 12px;
      right: 16px;
      background: transparent;
      border: none;
      font-size: 24px;
      color: #ffffff;
      cursor: pointer;
      opacity: 0.7;
    }
    .close-card-btn:hover { opacity: 1; }

    .khqr-header {
      display: flex;
      justify-content: center;
      margin-bottom: 10px;
    }

    .khqr-logo {
      background-color: #e1192e;
      color: #ffffff;
      font-weight: 900;
      font-size: 14px;
      letter-spacing: 1.5px;
      padding: 4px 18px;
      border-radius: 6px;
    }

    .merchant-info .bank-name {
      color: #00bcd4;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .merchant-info .merchant-name {
      color: #ffffff;
      font-size: 17px;
      font-weight: bold;
      margin: 2px 0 4px;
      text-transform: uppercase;
    }

    /* Input Custom Amount */
    .amount-input-wrapper {
      margin: 8px 0 12px;
    }

    .amount-input-group {
      display: inline-flex;
      align-items: center;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid #00bcd4;
      border-radius: 10px;
      padding: 4px 12px;
    }

    .currency-symbol {
      color: #22c55e;
      font-size: 24px;
      font-weight: bold;
      margin-right: 4px;
    }

    .amount-input {
      background: transparent;
      border: none;
      color: #22c55e;
      font-size: 24px;
      font-weight: bold;
      width: 110px;
      outline: none;
      text-align: left;
    }

    /* QR Box with ABA Logo Centered */
    .qr-wrapper {
      background: #ffffff;
      border-radius: 16px;
      padding: 14px;
      display: inline-block;
      margin: 0 auto 12px auto;
      position: relative;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #qrcode canvas, #qrcode img {
      display: block;
      border-radius: 6px;
    }

    /* Logo ABA នៅចំកណ្តាល QR */
    .qr-center-logo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 38px;
      height: 38px;
      background: #004b6e;
      border: 3px solid #ffffff;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      pointer-events: none;
    }

    .qr-center-logo span {
      color: #ffffff;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .quick-amounts {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 12px;
    }

    .amt-chip {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 4px 10px;
      border-radius: 16px;
      font-size: 12px;
      cursor: pointer;
    }

    .amt-chip:hover {
      background: #00bcd4;
      color: #0f172a;
      font-weight: bold;
    }

    .memo-badge {
      background: rgba(15, 23, 42, 0.6);
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 14px;
    }

    .memo-badge strong {
      color: #38bdf8;
      font-size: 14px;
      letter-spacing: 1px;
    }

    .btn-done {
      width: 100%;
      padding: 12px;
      background-color: #22c55e;
      border: none;
      border-radius: 10px;
      color: #ffffff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-done:hover { background-color: #16a34a; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="brand">🌐 FB Accounts Store</div>
    <div class="user-panel">
      <div class="balance-badge">សមតុល្យ: <span id="userBalance">$0.00</span></div>
      <button class="btn-topup" onclick="openDepositModal()">+ បញ្ចូលលុយ</button>
    </div>
  </nav>

  <!-- Container -->
  <div class="container">
    <div class="header-section">
      <h1>បញ្ជីគណនី Facebook សម្រាប់លក់</h1>
      <p>ជ្រើសរើសប្រភេទគណនីតាមប្រទេស អាយុកាល និងតម្លៃដែលអ្នកត្រូវការ</p>
    </div>

    <div class="filter-bar">
      <button class="filter-btn active" onclick="filterProducts('all', this)">ទាំងអស់</button>
      <button class="filter-btn" onclick="filterProducts('KH', this)">🇰🇭 Account ខ្មែរ</button>
      <button class="filter-btn" onclick="filterProducts('US', this)">🇺🇸 Account អាមេរិក</button>
    </div>

    <div class="product-grid" id="productContainer"></div>
  </div>

  <!-- Buy Modal -->
  <div class="modal-overlay" id="buyModal">
    <div class="modal-box">
      <h3 id="modalTitle">បញ្ជាក់ការទិញ</h3>
      <p id="modalDesc">តើអ្នកពិតជាចង់ទិញគណនីនេះមែនទេ?</p>
      <div style="display:flex; gap:10px; justify-content:center;">
        <button style="background:#475569; color:white; border:none; padding:8px 16px; border-radius:6px; cursor:pointer;" onclick="closeBuyModal()">បោះបង់</button>
        <button style="background:#22c55e; color:white; border:none; padding:8px 16px; border-radius:6px; cursor:pointer; font-weight:bold;" onclick="confirmPurchase()">យល់ព្រមទិញ</button>
      </div>
    </div>
  </div>

  <!-- ABA KHQR Deposit Modal -->
  <div class="modal-overlay" id="depositModal">
    <div class="aba-card">
      <button class="close-card-btn" onclick="closeDepositModal()">&times;</button>

      <div class="khqr-header">
        <div class="khqr-logo">KHQR</div>
      </div>

      <div class="merchant-info">
        <div class="bank-name">ABA BANK</div>
        <div class="merchant-name">MON SAMNANG</div>
        
        <!-- ប្រអប់ឱ្យភ្ញៀវបញ្ចូលចំនួនលុយតាមចិត្ត -->
        <div class="amount-input-wrapper">
          <div class="amount-input-group">
            <span class="currency-symbol">$</span>
            <input type="number" step="any" min="0.1" id="customAmountInput" class="amount-input" value="2.00" oninput="onAmountChanged()">
          </div>
        </div>
      </div>

      <!-- ប្រអប់ QR Code ដែលមាន Logo ABA នៅចំកណ្តាល -->
      <div class="qr-wrapper">
        <div id="qrcode"></div>
        <div class="qr-center-logo">
          <span>ABA</span>
        </div>
      </div>

      <!-- ប៊ូតុងផ្លូវកាត់សម្រាប់រើសតម្លៃ -->
      <div class="quick-amounts">
        <button type="button" class="amt-chip" onclick="setQuickAmount(1)">$1</button>
        <button type="button" class="amt-chip" onclick="setQuickAmount(2)">$2</button>
        <button type="button" class="amt-chip" onclick="setQuickAmount(5)">$5</button>
        <button type="button" class="amt-chip" onclick="setQuickAmount(10)">$10</button>
        <button type="button" class="amt-chip" onclick="setQuickAmount(20)">$20</button>
      </div>

      <div class="memo-badge">
        <span>កូដចំណាំ (Memo):</span>
        <strong id="transferCode">TOPUP9562</strong>
      </div>

      <button class="btn-done" onclick="submitDepositNotification()">ខ្ញុំបានផ្ទេររួចរាល់</button>
    </div>
  </div>

  <script>
    // ១. ក្បួនគណនា CRC16-CCITT សម្រាប់ Bakong KHQR Payload
    function getCRC16(data) {
      let crc = 0xFFFF;
      for (let i = 0; i < data.length; i++) {
        crc ^= data.charCodeAt(i) << 8;
        for (let j = 0; j < 8; j++) {
          if ((crc & 0x8000) !== 0) {
            crc = ((crc << 1) ^ 0x1021) & 0xFFFF;
          } else {
            crc = (crc << 1) & 0xFFFF;
          }
        }
      }
      let hex = crc.toString(16).toUpperCase();
      return hex.padStart(4, '0');
    }

    // ២. បង្កើត KHQR String ស្វ័យប្រវត្តិដែលមានតម្លៃទឹកប្រាក់ស្រាប់
    function generateDynamicKHQR(amount) {
      const formattedAmount = Number(amount).toFixed(2);
      const amtTag = "54" + formattedAmount.length.toString().padStart(2, '0') + formattedAmount;

      // Base Payload ដែលយកចេញពីកុង ABA របស់អ្នក
      const basePayload = 
        "000201010212" +
        "30510016abaakhppxxx@abaa01151260903142910660208ABA Bank" +
        "52046513" +
        "5303840" +
        amtTag + 
        "5802KH" +
        "5911MON SAMNANG" +
        "6012KAMPONG THOM" +
        "624268380010PAYWAY@ABA0107195096202090324860766304";

      const finalChecksum = getCRC16(basePayload);
      return basePayload + finalChecksum;
    }

    // ៣. បង្ហាញ QR Code ចូលទៅក្នុងប្រអប់
    let qrMaker = null;
    function renderQR(amount) {
      const qrContainer = document.getElementById("qrcode");
      qrContainer.innerHTML = "";

      const khqrString = generateDynamicKHQR(amount);

      qrMaker = new QRCode(qrContainer, {
        text: khqrString,
        width: 175,
        height: 175,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });
    }

    function onAmountChanged() {
      const val = parseFloat(document.getElementById("customAmountInput").value);
      if (!isNaN(val) && val > 0) {
        renderQR(val);
      }
    }

    function setQuickAmount(val) {
      document.getElementById("customAmountInput").value = val.toFixed(2);
      renderQR(val);
    }

    function openDepositModal() {
      const randomMemo = "TOPUP" + Math.floor(1000 + Math.random() * 9000);
      document.getElementById('transferCode').textContent = randomMemo;
      document.getElementById('depositModal').style.display = 'flex';
      
      const currentVal = parseFloat(document.getElementById("customAmountInput").value) || 2.00;
      renderQR(currentVal);
    }

    function closeDepositModal() {
      document.getElementById('depositModal').style.display = 'none';
    }

    // ៤. ដំណើរការពេលភ្ញៀវចុច "ខ្ញុំបានផ្ទេររួចរាល់" (មិនបូកលុយដើរខ្លួនឯងទេ)
    function submitDepositNotification() {
      const amount = document.getElementById("customAmountInput").value;
      const memo = document.getElementById("transferCode").textContent;

      // បង្ហាញសារជូនដំណឹងឱ្យផ្ញើវិក្កយបត្រដើម្បី Admin ពិនិត្យបញ្ជាក់
      alert(`សំណើបញ្ចូលប្រាក់ចំនួន $${amount} (Memo: ${memo}) ត្រូវបានកត់ត្រា!\n\nសូមរក្សាទុកវិក្កយបត្រ ABA របស់អ្នក ឬផ្ញើវិក្កយបត្រទៅកាន់ Telegram Admin ដើម្បីផ្ទៀងផ្ទាត់ និងបញ្ចូលសមតុល្យជូន។`);
      
      closeDepositModal();
    }

    // ៥. ទិន្នន័យទំនិញ
    const products = [
      { id: 1, title: "Via FB ខ្មែរ (Old Account)", country: "KH", countryName: "ខ្មែរ 🇰🇭", age: "បង្កើតឆ្នាំ 2018 - 2020", format: "UID | Pass | 2FA | Mail", stock: 24, price: 1.50 },
      { id: 2, title: "Clone FB ខ្មែរ (បង្កើតថ្មី)", country: "KH", countryName: "ខ្មែរ 🇰🇭", age: "អាយុ 1 - 3 ខែ", format: "UID | Pass | 2FA", stock: 50, price: 0.35 },
      { id: 3, title: "Via FB អាមេរិក (US Aged)", country: "US", countryName: "អាមេរិក 🇺🇸", age: "បង្កើតឆ្នាំ 2015 - 2017", format: "UID | Pass | 2FA | Hotmail", stock: 12, price: 3.20 },
      { id: 4, title: "Via FB អាមេរិក (Run Ads)", country: "US", countryName: "អាមេរិក 🇺🇸", age: "បង្កើតឆ្នាំ 2021 - 2022", format: "UID | Pass | 2FA | Mail", stock: 18, price: 2.00 }
    ];

    let currentBalance = 0.00;
    let selectedProduct = null;

    function renderProducts(items) {
      const container = document.getElementById('productContainer');
      container.innerHTML = "";
      items.forEach(item => {
        const tagClass = item.country === 'KH' ? 'tag-kh' : 'tag-us';
        container.innerHTML += `
          <div class="product-card">
            <div>
              <div class="card-top">
                <div class="product-title">${item.title}</div>
                <span class="country-tag ${tagClass}">${item.countryName}</span>
              </div>
              <ul class="product-meta">
                <li><span>អាយុអាខោន:</span><span class="highlight">${item.age}</span></li>
                <li><span>ទម្រង់ទិន្នន័យ:</span><span>${item.format}</span></li>
                <li><span>ស្តុកនៅសល់:</span><span class="stock-badge">${item.stock} អាខោន</span></li>
              </ul>
            </div>
            <div class="card-bottom">
              <div class="price-tag">$${item.price.toFixed(2)}</div>
              <button class="btn-buy" onclick="openBuyModal(${item.id})">ទិញភ្លាមៗ</button>
            </div>
          </div>
        `;
      });
    }

    function filterProducts(type, btnElement) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');
      if (type === 'all') renderProducts(products);
      else renderProducts(products.filter(p => p.country === type));
    }

    function openBuyModal(productId) {
      selectedProduct = products.find(p => p.id === productId);
      document.getElementById('modalTitle').textContent = `ទិញ: ${selectedProduct.title}`;
      document.getElementById('modalDesc').innerHTML = `តម្លៃ: <strong>$${selectedProduct.price.toFixed(2)}</strong><br>តើអ្នកយល់ព្រមទិញដែរឬទេ?`;
      document.getElementById('buyModal').style.display = 'flex';
    }

    function closeBuyModal() {
      document.getElementById('buyModal').style.display = 'none';
      selectedProduct = null;
    }

    function confirmPurchase() {
      if (!selectedProduct) return;
      if (currentBalance < selectedProduct.price) {
        alert("សមតុល្យមិនគ្រប់គ្រាន់ទេ! សូមចុច 'បញ្ចូលលុយ' តាម ABA KHQR។");
        closeBuyModal();
        return;
      }
      currentBalance -= selectedProduct.price;
      document.getElementById('userBalance').textContent = `$${currentBalance.toFixed(2)}`;
      selectedProduct.stock -= 1;
