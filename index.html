<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FB Accounts Store - KHQR Topup</title>
  
  <!-- បណ្ណាល័យ QRCode.js សម្រាប់គូររូប QR Code ដោយស្វ័យប្រវត្តិ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navbar */
    .navbar {
      background-color: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      font-size: 18px;
      font-weight: bold;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user-panel {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .balance-badge {
      background-color: #0f172a;
      border: 1px solid #3b82f6;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      color: #93c5fd;
    }

    .balance-badge span {
      color: #22c55e;
      font-weight: bold;
    }

    .btn-topup {
      background-color: #22c55e;
      color: #ffffff;
      border: none;
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-topup:hover {
      background-color: #16a34a;
    }

    /* Container */
    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
      width: 100%;
      flex: 1;
    }

    .header-section {
      margin-bottom: 24px;
    }

    .header-section h1 {
      font-size: 24px;
      margin-bottom: 6px;
    }

    .header-section p {
      color: #94a3b8;
      font-size: 14px;
    }

    /* Filter Buttons */
    .filter-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }

    .filter-btn:hover, .filter-btn.active {
      background-color: #2563eb;
      border-color: #2563eb;
      color: #ffffff;
    }

    /* Product Grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .product-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }

    .product-card:hover {
      transform: translateY(-3px);
      border-color: #3b82f6;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .product-title {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      line-height: 1.4;
    }

    .country-tag {
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .tag-kh {
      background-color: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border: 1px solid #ef4444;
    }

    .tag-us {
      background-color: rgba(59, 130, 246, 0.2);
      color: #93c5fd;
      border: 1px solid #3b82f6;
    }

    .product-meta {
      list-style: none;
      margin-bottom: 18px;
      font-size: 13px;
      color: #94a3b8;
    }

    .product-meta li {
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed #334155;
      padding-bottom: 4px;
    }

    .product-meta li span.highlight {
      color: #f1f5f9;
      font-weight: 500;
    }

    .stock-badge {
      color: #22c55e !important;
      font-weight: bold;
    }

    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .price-tag {
      font-size: 20px;
      font-weight: bold;
      color: #38bdf8;
    }

    .btn-buy {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-buy:hover {
      background-color: #1d4ed8;
    }

    /* Modals Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .modal-box {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
      width: 90%;
      max-width: 400px;
      text-align: center;
    }

    .modal-box h3 { margin-bottom: 10px; }
    .modal-box p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }

    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .btn-cancel {
      background-color: #475569;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-confirm {
      background-color: #22c55e;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    /* ABA KHQR Card Style */
    .aba-card {
      background: #004b6e;
      border-radius: 20px;
      width: 90%;
      max-width: 350px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.15);
      animation: popUp 0.25s ease-out;
    }

    @keyframes popUp {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .close-card-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      background: transparent;
      border: none;
      font-size: 24px;
      color: #ffffff;
      cursor: pointer;
      opacity: 0.7;
    }

    .close-card-btn:hover { opacity: 1; }

    .khqr-header {
      display: flex;
      justify-content: center;
      margin-bottom: 12px;
    }

    .khqr-logo {
      background-color: #e1192e;
      color: #ffffff;
      font-weight: 900;
      font-size: 14px;
      letter-spacing: 1.5px;
      padding: 4px 18px;
      border-radius: 6px;
      display: inline-block;
      box-shadow: 0 2px 8px rgba(225, 25, 46, 0.4);
    }

    .merchant-info .bank-name {
      color: #00bcd4;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .merchant-info .merchant-name {
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      margin: 2px 0 6px;
      text-transform: uppercase;
    }

    .merchant-info .deposit-amount {
      font-size: 26px;
      font-weight: 800;
      color: #22c55e;
      margin-bottom: 14px;
    }

    .qr-wrapper {
      background: #ffffff;
      border-radius: 14px;
      padding: 12px;
      display: inline-block;
      margin: 0 auto 14px auto;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    #qrcode {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #qrcode img, #qrcode canvas {
      display: block;
      border-radius: 4px;
    }

    .quick-amounts {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .amt-chip {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .amt-chip:hover, .amt-chip.active {
      background: #00bcd4;
      border-color: #00bcd4;
      color: #0f172a;
      font-weight: bold;
    }

    .memo-badge {
      background: rgba(15, 23, 42, 0.6);
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 15px;
    }

    .memo-badge strong {
      color: #38bdf8;
      font-size: 14px;
      letter-spacing: 1px;
    }

    .btn-done {
      width: 100%;
      padding: 11px;
      background-color: #22c55e;
      border: none;
      border-radius: 10px;
      color: #ffffff;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-done:hover {
      background-color: #16a34a;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="brand">
      🌐 FB Accounts Store
    </div>
    <div class="user-panel">
      <div class="balance-badge">
        សមតុល្យ: <span id="userBalance">$5.00</span>
      </div>
      <button class="btn-topup" onclick="openDepositModal()">+ បញ្ចូលលុយ</button>
    </div>
  </nav>

  <!-- Container -->
  <div class="container">
    <div class="header-section">
      <h1>បញ្ជីគណនី Facebook សម្រាប់លក់</h1>
      <p>ជ្រើសរើសប្រភេទគណនីតាមប្រទេស អាយុកាល និងតម្លៃដែលអ្នកត្រូវការ</p>
    </div>

    <!-- Filter Buttons -->
    <div class="filter-bar">
      <button class="filter-btn active" onclick="filterProducts('all', this)">ទាំងអស់</button>
      <button class="filter-btn" onclick="filterProducts('KH', this)">🇰🇭 Account ខ្មែរ</button>
      <button class="filter-btn" onclick="filterProducts('US', this)">🇺🇸 Account អាមេរិក</button>
    </div>

    <!-- Products Grid -->
    <div class="product-grid" id="productContainer"></div>
  </div>

  <!-- Buy Confirmation Modal -->
  <div class="modal-overlay" id="buyModal">
    <div class="modal-box">
      <h3 id="modalTitle">បញ្ជាក់ការទិញ</h3>
      <p id="modalDesc">តើអ្នកពិតជាចង់ទិញគណនីនេះមែនទេ?</p>
      <div class="modal-buttons">
        <button class="btn-cancel" onclick="closeBuyModal()">បោះបង់</button>
        <button class="btn-confirm" onclick="confirmPurchase()">យល់ព្រមទិញ</button>
      </div>
    </div>
  </div>

  <!-- ABA KHQR Deposit Modal -->
  <div class="modal-overlay" id="depositModal">
    <div class="aba-card">
      <button class="close-card-btn" onclick="closeDepositModal()">&times;</button>

      <div class="khqr-header">
        <div class="khqr-logo">KHQR</div>
      </div>

      <div class="merchant-info">
        <div class="bank-name">ABA BANK</div>
        <div class="merchant-name">MON SAMNANG</div>
        <div class="deposit-amount" id="displayAmount">$2.00</div>
      </div>

      <!-- ប្រអប់បង្ហាញ QR Code ដែល Generate ដោយ JS -->
      <div class="qr-wrapper">
        <div id="qrcode"></div>
      </div>

      <div class="quick-amounts">
        <button type="button" class="amt-chip" onclick="setDepositAmount(1, this)">$1</button>
        <button type="button" class="amt-chip active" onclick="setDepositAmount(2, this)">$2</button>
        <button type="button" class="amt-chip" onclick="setDepositAmount(5, this)">$5</button>
        <button type="button" class="amt-chip" onclick="setDepositAmount(10, this)">$10</button>
      </div>

      <div class="memo-badge">
        <span>កូដចំណាំ (Memo):</span>
        <strong id="transferCode">TOPUP889</strong>
      </div>

      <button class="btn-done" onclick="confirmPayment()">ខ្ញុំបានផ្ទេររួចរាល់</button>
    </div>
  </div>

  <script>
    // ១. ខ្សែអក្សរ ABA KHQR String ផ្ទាល់ខ្លួនរបស់អ្នក
    const myBakongKHQRString = "00020101021130510016abaakhppxxx@abaa01151260903142910660208ABA Bank5204651353038405802KH5911MON SAMNANG6012KAMPONG THOM624268380010PAYWAY@ABA01071950962020903248607663044150";

    // ២. បញ្ជីទំនិញគំរូ
    const products = [
      {
        id: 1,
        title: "Via FB ខ្មែរ (Old Account)",
        country: "KH",
        countryName: "ខ្មែរ 🇰🇭",
        age: "បង្កើតឆ្នាំ 2018 - 2020 (អាយុ 4-6 ឆ្នាំ)",
        format: "UID | Pass | 2FA | Mail",
        stock: 24,
        price: 1.50
      },
      {
        id: 2,
        title: "Clone FB ខ្មែរ (បង្កើតថ្មី)",
        country: "KH",
        countryName: "ខ្មែរ 🇰🇭",
        age: "អាយុ 1 - 3 ខែ (New Profile)",
        format: "UID | Pass | 2FA",
        stock: 50,
        price: 0.35
      },
      {
        id: 3,
        title: "Via FB អាមេរិក (US Aged)",
        country: "US",
        countryName: "អាមេរិក 🇺🇸",
        age: "បង្កើតឆ្នាំ 2015 - 2017 (អាយុ 7-9 ឆ្នាំ)",
        format: "UID | Pass | 2FA | Hotmail | Cookie",
        stock: 12,
        price: 3.20
      },
      {
        id: 4,
        title: "Via FB អាមេរិក (Run Ads)",
        country: "US",
        countryName: "អាមេរិក 🇺🇸",
        age: "បង្កើតឆ្នាំ 2021 - 2022 (អាយុ 2-3 ឆ្នាំ)",
        format: "UID | Pass | 2FA | Mail",
        stock: 18,
        price: 2.00
      }
    ];

    let currentBalance = 5.00;
    let selectedDepositAmount = 2.00;
    let selectedProduct = null;
    let qrInstance = null;

    // ៣. បង្ហាញបញ្ជីទំនិញ
    function renderProducts(items) {
      const container = document.getElementById('productContainer');
      container.innerHTML = "";

      items.forEach(item => {
        const tagClass = item.country === 'KH' ? 'tag-kh' : 'tag-us';
        container.innerHTML += `
          <div class="product-card">
            <div>
              <div class="card-top">
                <div class="product-title">${item.title}</div>
                <span class="country-tag ${tagClass}">${item.countryName}</span>
              </div>
              <ul class="product-meta">
                <li><span>អាយុអាខោន:</span><span class="highlight">${item.age}</span></li>
                <li><span>ទម្រង់ទិន្នន័យ:</span><span>${item.format}</span></li>
                <li><span>ស្តុកនៅសល់:</span><span class="stock-badge">${item.stock} អាខោន</span></li>
              </ul>
            </div>
            <div class="card-bottom">
              <div class="price-tag">$${item.price.toFixed(2)}</div>
              <button class="btn-buy" onclick="openBuyModal(${item.id})">ទិញភ្លាមៗ</button>
            </div>
          </div>
        `;
      });
    }

    function filterProducts(type, btnElement) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');

      if (type === 'all') {
        renderProducts(products);
      } else {
        renderProducts(products.filter(p => p.country === type));
      }
    }

    // ៤. ទិញគណនី Logic
    function openBuyModal(productId) {
      selectedProduct = products.find(p => p.id === productId);
      document.getElementById('modalTitle').textContent = `ទិញ: ${selectedProduct.title}`;
      document.getElementById('modalDesc').innerHTML = `តម្លៃ: <strong>$${selectedProduct.price.toFixed(2)}</strong> | អាយុ: ${selectedProduct.age}<br>តើអ្នកយល់ព្រមទិញដែរឬទេ?`;
      document.getElementById('buyModal').style.display = 'flex';
    }

    function closeBuyModal() {
      document.getElementById('buyModal').style.display = 'none';
      selectedProduct = null;
    }

    function confirmPurchase() {
      if (!selectedProduct) return;

      if (currentBalance < selectedProduct.price) {
        alert("សមតុល្យលុយរបស់អ្នកមិនគ្រប់គ្រាន់ទេ! សូមចុច 'បញ្ចូលលុយ' តាម ABA KHQR។");
        closeBuyModal();
        return;
      }

      currentBalance -= selectedProduct.price;
      document.getElementById('userBalance').textContent = `$${currentBalance.toFixed(2)}`;
      selectedProduct.stock -= 1;
      renderProducts(products);

      alert(`ការទិញបានជោគជ័យ!\n\nព័ត៌មានគណនី:\n1000849281928|Pass123456|JBSWY3DPEHPK3PXP|mail@domain.com`);
      closeBuyModal();
    }

    // ៥. ABA KHQR Generator Logic
    function renderKHQR() {
      const qrContainer = document.getElementById("qrcode");
      qrContainer.innerHTML = ""; // សម្អាតចាស់

      qrInstance = new QRCode(qrContainer, {
        text: myBakongKHQRString,
        width: 170,
        height: 170,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });
    }

    function openDepositModal() {
      // បង្កើត Memo ចៃដន្យ
      const randomMemo = "TOPUP" + Math.floor(1000 + Math.random() * 9000);
      document.getElementById('transferCode').textContent = randomMemo;
      document.getElementById('depositModal').style.display = 'flex';
      
      // គូររូប QR Code ចូល
      renderKHQR();
    }

    function closeDepositModal() {
      document.getElementById('depositModal').style.display = 'none';
    }

    function setDepositAmount(amount, btnElement) {
      selectedDepositAmount = amount;
      document.getElementById('displayAmount').textContent = `$${amount.toFixed(2)}`;

      document.querySelectorAll('.amt-chip').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
    }

    function confirmPayment() {
      currentBalance += selectedDepositAmount;
      document.getElementById('userBalance').textContent = `$${currentBalance.toFixed(2)}`;
      alert(`ការបញ្ចូលទឹកប្រាក់ចំនួន $${selectedDepositAmount.toFixed(2)} ទទួលបានជោគជ័យ!`);
      closeDepositModal();
    }

    // ចាប់ផ្ដើមដំបូង
    renderProducts(products);
  </script>
</body>
</html>
